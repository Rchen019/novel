# ────────────────────────────────────────────────
# AI Novel Studio - application.properties
# ────────────────────────────────────────────────

server.port=8080

# SQLite 数据源
spring.datasource.url=jdbc:sqlite:./data/novel_studio.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 跨域（开发阶段允许前端 5173 端口）
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# OpenRouter
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
# 将你的 Key 填到这里，或通过环境变量 OPENROUTER_API_KEY 注入
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.http-referer=http://localhost:8080
openrouter.app-title=AI Novel Studio

# Memory Manager 默认参数
memory.recent-chapters=2
memory.max-context-tokens=3000

# 日志
logging.level.com.novelstudio=DEBUG
logging.level.org.hibernate.SQL=WARN

# 关闭默认静态资源映射（纯 API 后端，避免 NoResourceFoundException 被当成 500）
spring.web.resources.add-mappings=false
